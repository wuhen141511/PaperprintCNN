[project]
name = "imagenet"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12, <3.13"
dependencies = [
    "ruff>=0.14.7",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "tqdm>=4.65.0",
    "tensorboard>=2.13.0",
    "pyyaml>=6.0",
    "opencv-contrib-python>=4.11.0.86",
    "timm>=1.0.22",
    "onnx>=1.15.0",
]

# 配置镜像源：阿里云作为主源，PyTorch CUDA 源作为额外索引
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# GPU用户请取消注释以下配置以安装CUDA版本：
# [[tool.uv.index]]
# name = "pytorch"
# url = "https://download.pytorch.org/whl/cu124"
# explicit = true
#
